name: shop_analytics
version: "1.0.0"
config-version: 2

profile: shop_analytics

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  shop_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

# 실패한 테스트의 위반 행을 별도 스키마 테이블로 저장 (BI 대시보드에서 DQ 실패 추이를 보여줄 소재)
tests:
  shop_analytics:
    +store_failures: true
    +schema: dq
